data:
  path: ../data/sample_issues.csv   # Path to the synthetic dataset

models:
  tfidf:
    ngram_min: 1                 # Minimum n-gram size for TF-IDF
    ngram_max: 2                 # Maximum n-gram size for TF-IDF
    min_df: 2                    # Minimum document frequency
  embedder: all-MiniLM-L6-v2     # Default SentenceTransformer model
  knn_k: 3                       # Number of neighbors for kNN                   

eval:
  random_seed: 42                # Reproducibility
  test_size: 0.2                 # Train/test split ratio
  metrics: ["accuracy", "f1", "precision", "recall"]

fine_tuning:
  model_name: all-MiniLM-L6-v2   # Model to fine-tune
  epochs: 3                      # Number of fine-tuning epochs
  batch_size: 16                 # Mini-batch size
  output_dir: ../results/models/minilm_finetuned  # Save directory for fine-tuned model